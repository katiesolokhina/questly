<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Questly</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
  <style>
    .offline { max-width: 420px; margin: 0 auto; min-height: 100dvh; padding: 32px 24px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }
    .offline img { width: 72px; height: 72px; }
    .offline h1 { font-size: 24px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="offline">
    <img src="/icons/icon.svg" alt="">
    <h1>You're offline</h1>
    <p class="muted">Questly needs a connection to log check-ins, so nothing gets lost or counted twice.</p>
    <a class="btn btn-primary" href="/">Try again</a>
  </main>
</body>
</html>
